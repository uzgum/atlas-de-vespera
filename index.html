<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas de Vespera</title>

    <!-- Tipografías Medievales de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- CSS de Leaflet (para que el mapa y los controles se vean correctamente) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Tu archivo de estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <h1 class="logo">Atlas de Vespera</h1>
        <nav>
            <ul>
                <li><a href="#" class="active">Mapa</a></li>
                <li><a href="#">Personajes</a></li>
                <li><a href="#">NPCs</a></li>
                <li><a href="#">Diario</a></li>
                <li><a href="#">Cronología</a></li>
            </ul>
        </nav>
    </header>

    <!-- ESTRUCTURA PRINCIPAL -->
    <div id="main-layout">
        
        <!-- SECCIÓN IZQUIERDA: EL MAPA -->
        <main id="map-section">
            <div id="map"></div>
        </main>

        <!-- SECCIÓN DERECHA: PANEL TIPO CÓDICE / INFORMACIÓN -->
        <aside id="info-panel" class="codex-panel">
            <div class="codex-header">
                <h2 id="location-title">Explorador de Vespera</h2>
                <span class="codex-subtitle">Selecciona una ubicación en el mapa</span>
            </div>
            
            <div class="codex-content" id="location-details">
                <p>Haz clic sobre un pin en el mapa para revelar los secretos de las ciudades, ruinas o puertos de este reino.</p>
            </div>
        </aside>

    </div>

    <!-- SCRIPT DE LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- NUESTRO SCRIPT (lo crearemos en el siguiente paso) -->
    <script src="js/main.js"></script>

</body>
</html>
